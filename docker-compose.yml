# Docker-Compose-Definition für Coolify ("Docker Compose"-Build-Pack) oder
# lokalen Betrieb. Enthält App und PostgreSQL. Bei Coolify die
# Umgebungsvariablen im Dashboard setzen; sie überschreiben die Werte hier.
services:
  youtube-pro:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      TRUST_PROXY: "1"
      ENV_FILE: /app/data/.env
      DATABASE_URL: postgres://youtubepro:${POSTGRES_PASSWORD:-youtubepro}@postgres:5432/youtubepro
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      OUTPUT_LANGUAGE: ${OUTPUT_LANGUAGE:-German (Deutsch)}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
    volumes:
      - youtube-pro-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: youtubepro
      POSTGRES_USER: youtubepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youtubepro}
    volumes:
      - youtube-pro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtubepro -d youtubepro"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  youtube-pro-data:
  youtube-pro-postgres:
