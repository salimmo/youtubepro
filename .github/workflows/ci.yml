name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.12.0"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Run TypeScript check
        run: npm run check

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: youtube-pro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starten und Health-Check prüfen
        run: |
          docker run -d --name youtube-pro -p 5000:5000 youtube-pro:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/api/health | grep -q '"status":"ok"'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "Health-Check fehlgeschlagen"; docker logs youtube-pro; exit 1
